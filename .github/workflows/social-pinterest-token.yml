# Weekly Pinterest token keepalive: refreshes the token (resets the refresh-token clock, stores a
# rotated token encrypted in state/pinterest_token.json), checks scopes, and emails 30 days before
# the refresh token expires. A failed refresh is a failure email. Skips if Pinterest is not set up.

name: Social Pinterest Token

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-pinterest-token
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests cryptography
      - name: Refresh and check
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_STATE_KEY: ${{ secrets.PINTEREST_STATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM_IG }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python pinterest_token_check.py
