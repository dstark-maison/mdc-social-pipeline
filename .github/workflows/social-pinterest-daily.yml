# Daily Pinterest publisher for approved (scheduled) backfill pins, at most 3 per day.
# OFF until Pinterest approves Standard access: pinterest_daily.py exits immediately while
# config.PINTEREST_STANDARD_ACCESS is False.

name: Social Pinterest Daily

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-pinterest-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests cryptography
      - name: Publish due pins
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_STATE_KEY: ${{ secrets.PINTEREST_STATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM_IG }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python pinterest_daily.py
