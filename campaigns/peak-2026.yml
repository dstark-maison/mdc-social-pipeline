# Black Week + Christmas 2026 social posts (Instagram + Facebook, German only).
# Read by campaign_run.py (daily job) and core/campaign.py. Times are Europe/Berlin.
# Change a single post: edit it here and merge. Cancel one: set `skip: true` (or press Reject in its email).
campaign: peak-2026
timezone: Europe/Berlin
draft_time: "07:00"      # draft + ONE confirmation email on the morning of the post's date
publish_time: "09:00"    # approved before this -> published at this time; later -> published on approval
                         # nothing is published after 23:59 of the post's date (the draft is marked `expired`)
last_post_date: 2026-12-08   # the draft/publish steps do nothing after this date

images:
  black-week-de:
    file: mdc-black-week-2026-social-de-1080x1350.jpg
    url: https://cdn.shopify.com/s/files/1/0884/0278/8685/files/mdc-black-week-2026-social-de-1080x1350.jpg?v=1794232446
  christmas-de:
    file: mdc-christmas-2026-social-de-1080x1350.jpg
    url: https://cdn.shopify.com/s/files/1/0884/0278/8685/files/mdc-christmas-2026-social-de-1080x1350.jpg?v=1794232447

# /pages/latest-post (BIO_LINK_PATH) is pointed at these collections for the date range (inclusive).
# From reset_on the pipeline's normal behaviour (newest published blog post) returns.
# While a range is active, blog publishes only update the ledger pointer, never the redirect.
bio_link:
  ranges:
    - {from: 2026-11-23, to: 2026-11-30, path: /collections/black-friday}
    - {from: 2026-12-01, to: 2026-12-25, path: /collections/weihnachtsgeschenke}
  reset_on: 2026-12-26

posts:
  - id: "9261123001"        # numeric: approval titles only accept digits
    date: 2026-11-23
    type: feed
    channels: [ig, fb]
    image: black-week-de
    fb_link: https://maisondecocon.com/collections/black-friday?utm_source=facebook&utm_medium=social&utm_campaign=bw26
